directories:
  output: dist
  buildResources: build
appId: com.boutiqueos.app
productName: BoutiqueOS
files:
  - filter:
      - electron/**/*
      - .next/**/*
      - public/**/*
      - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 43.4.0
